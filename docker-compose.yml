version: '3.8'
services:
  postgres:
    image: postgres:17
    container_name: postgres-container
    environment:
      POSTGRES_DB: portfolio_tracker
      POSTGRES_USER: ${DB_USERNAME:-yassine}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
