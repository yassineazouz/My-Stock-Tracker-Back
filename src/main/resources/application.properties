spring.application.name=portfolio-tracker
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/portfolio_tracker}
spring.datasource.username=${DB_USERNAME:yassine}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
twelvedata.api.key=${TWELVEDATA_API_KEY}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
alerts.check.enabled=${ALERTS_CHECK_ENABLED:true}
alerts.check.fixed-delay-ms=${ALERTS_CHECK_FIXED_DELAY_MS:60000}
